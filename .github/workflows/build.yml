name: Build firmware

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - keyboard: crkbd/rev4_1/standard
            asset: corne-v4.1-mac-layers.uf2
          - keyboard: crkbd/rev4_0/standard
            asset: corne-v4.0-mac-layers.uf2
    steps:
      - uses: actions/checkout@v4

      - name: Fetch vial-qmk
        run: ./scripts/fetch-vial-qmk.sh vial-qmk

      - name: Add keymap
        run: cp -r keymap/mac_layers vial-qmk/keyboards/crkbd/keymaps/mac_layers

      - name: Build
        working-directory: vial-qmk
        run: make ${{ matrix.keyboard }}:mac_layers

      - name: Collect firmware
        shell: bash
        run: |
          target="${{ matrix.keyboard }}"
          cp "vial-qmk/${target//\//_}_mac_layers.uf2" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # Un solo job publica la release para que los builds de la matriz no compitan al crearla
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: firmware
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: firmware/*.uf2
          generate_release_notes: true

name: Layout proposal
description: Suggest a change to the Mac layout or a new variant
labels: [layout]
body:
  - type: textarea
    id: change
    attributes:
      label: What would you change?
      description: Which layer and keys, and what they should do.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: The task it makes easier (coding, navigation, shortcuts) and why the current layout gets in the way.
    validations:
      required: true
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: I can open a pull request with the updated .vil and regenerated images (./scripts/draw.sh)
